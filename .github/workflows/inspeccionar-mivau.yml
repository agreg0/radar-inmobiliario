name: Inspeccionar histórico oficial MIVAU
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspeccionar CSV oficial sin alterar datos
        run: python inspeccionar_mivau.py
