name: Actualizar indicadores
on:
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * 1'
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python actualizar.py
      - name: Guardar datos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --cached --quiet || (git commit -m 'Actualizar datos de vivienda' && git push)
